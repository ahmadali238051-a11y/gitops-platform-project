apiVersion: apps/v1

kind: Deployment

metadata:
  name: production-gitops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: production-gitops-platform

  template:
    metadata:
      labels:
        app: production-gitops-platform

    spec:
      containers:
        - name: gitops-platform-container
          image: w616/production-gitops-platform:v1
          ports:
            - containerPort: 8000